[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=node_modules/forge-std/src/",
]
# Deploy scripts record addresses in deployments/<chain id>.json for the web app.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[rpc_endpoints]
local = "http://127.0.0.1:8545"
celo_sepolia = "https://forno.celo-sepolia.celo-testnet.org"
base_sepolia = "https://sepolia.base.org"

[fmt]
line_length = 120
